name: Deploy to WordPress.org

on:
  release:
    types: [published]

# GitHub Releases are published by ./publish-release.sh after every prod deploy
# (they are the app's "latest version" download). The plugin is not on
# WordPress.org yet (planned for 1.0.0) and the repo holds no SVN secrets, so
# the job is skipped — visibly — until the repo variable WPORG_DEPLOY is set
# to 'true' (Settings → Secrets and variables → Actions → Variables).
jobs:
  deploy:
    name: Deploy to WordPress.org
    if: vars.WPORG_DEPLOY == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Install Composer dependencies (production)
        run: |
          cd arcadia-agents
          composer install --no-dev --prefer-dist --optimize-autoloader

      - name: WordPress Plugin Deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.WP_ORG_USERNAME }}
          SVN_PASSWORD: ${{ secrets.WP_ORG_PASSWORD }}
          SLUG: arcadia-agents
          BUILD_DIR: arcadia-agents
