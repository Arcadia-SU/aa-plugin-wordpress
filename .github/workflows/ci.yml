name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    name: PHP syntax (8.0–8.3)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.0', '8.1', '8.2', '8.3']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}

      - name: Lint all PHP files
        run: find arcadia-agents -name "*.php" -not -path "*/vendor/*" -print0 | xargs -0 -n1 -P4 php -l

  static-analysis:
    name: wp_slash gate + PHPStan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Install Composer dependencies (with dev)
        run: cd arcadia-agents && composer install --prefer-dist --no-progress

      # Keystone anti-regression: no WordPress write may ship without wp_slash().
      - name: wp_slash safety gate
        run: cd arcadia-agents && php bin/check-wp-slash.php

      - name: PHPStan
        run: cd arcadia-agents && vendor/bin/phpstan analyse --no-progress --memory-limit=2G

  coding-standards:
    name: WordPress Coding Standards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer, cs2pr

      # One require, explicit constraints. Three unpinned sequential requires
      # broke the day PHPCS 4.0 shipped: the first call installed 4.x, then no
      # wp-coding-standards/wpcs release could satisfy it (3.4.1 needs ^3.13.5)
      # and the job went red on install — nothing to do with the code under
      # review. Resolving all three at once lets Composer pick a coherent set.
      #
      # No manual `--config-set installed_paths`: the dealerdirect composer
      # plugin registers ALL installed standards, including the Paragonie ones
      # PHPCompatibilityWP depends on — a hand-written list overwrote that and
      # broke sniff registration ("Referenced sniff ... does not exist").
      - name: Install PHPCS and WordPress standards
        run: |
          composer global config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --no-progress \
            "squizlabs/php_codesniffer:^3.13" \
            "wp-coding-standards/wpcs:^3.1" \
            "phpcompatibility/phpcompatibility-wp:^2.1"
          ~/.composer/vendor/bin/phpcs -i

      - name: Run PHPCS
        run: cd arcadia-agents && ~/.composer/vendor/bin/phpcs --standard=phpcs.xml --report=checkstyle | cs2pr
        continue-on-error: true

  # BLOCKING, unlike the full WPCS job above: the plugin header declares
  # `Requires PHP: 8.0`, so WordPress will happily install this plugin on a
  # PHP 8.0 site — any use of an 8.1+ function must fail the build, not
  # drown in advisory style warnings.
  php-compatibility:
    name: PHPCompatibility (PHP 8.0+)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Install PHPCompatibility
        run: |
          composer global config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --no-progress \
            "squizlabs/php_codesniffer:^3.13" \
            "phpcompatibility/phpcompatibility-wp:^2.1"
          ~/.composer/vendor/bin/phpcs -i

      - name: Check PHP 8.0+ compatibility
        run: |
          ~/.composer/vendor/bin/phpcs -p --standard=PHPCompatibilityWP \
            --runtime-set testVersion 8.0- \
            --extensions=php \
            --ignore='*/vendor/*,*/tests/*,*/test/*' \
            arcadia-agents

  test:
    name: PHPUnit (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    needs: [syntax, static-analysis]
    strategy:
      matrix:
        # PHPUnit ^10 requires PHP 8.1 — the 8.0 floor is covered by the
        # syntax matrix above plus the blocking PHPCompatibility job.
        php-version: ['8.1', '8.2', '8.3']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer

      - name: Install Composer dependencies (with dev)
        run: cd arcadia-agents && composer install --prefer-dist --no-progress

      # Unit tests use hand-mocks (tests/unit/bootstrap.php) — no DB/WordPress needed.
      - name: Run PHPUnit
        run: cd arcadia-agents && ./vendor/bin/phpunit
