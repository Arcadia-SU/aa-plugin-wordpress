# Versions du plugin actuellement déployées sur les sites clients.
#
# Format : <hôte> <version>   (lignes vides et commentaires ignorés)
#
# Ce fichier est lu par build.sh (gate #15) : le build teste l'upgrade vers le
# zip candidat depuis N-1 ET depuis la PLUS VIEILLE version listée ici. Le zip
# de cette version doit exister dans dist/ — sinon le build échoue.
#
# Mise à jour : dernière étape du rituel de déploiement (docs/deploy.md).
# Relevé en direct : curl -s https://<hôte>/wp-json/arcadia/v1/health
# (les deux préprods sont derrière un basic auth — relever depuis le navigateur)
#
# ⚠️ Ce fichier est la seule liste de la flotte que nous tenions, et il a dérivé :
# jusqu'au 2026-08-21 il ne portait que 3 des 5 sites connectés, et donnait
# trottinette deux versions en retard. La sonde d'AA du 18/08 était fausse
# ailleurs (caleconpourhomme relevé en 0.1.0 sans /contents, en fait 0.7.0 avec
# /contents complet). Aucune des deux sources n'est fiable de mémoire : sonder.

# ⚠️ caleconpourhomme (o2switch PowerBoost) met en cache /wp-json/... : après
# l'upgrade 0.11.0 du 2026-10-04, /wp-json/arcadia/v1/health répondait encore
# 0.7.0 alors que le code neuf tournait. Relever via ?rest_route= (non caché) :
# curl -s "https://<hôte>/?rest_route=/arcadia/v1/health&t=$(date +%s)"

# --- Relevés par /health le 2026-10-04 (trottinette, caleconpourhomme) et 2026-08-21 (iselection) ---
www.iselection.com 0.5.2
www.trottinette-tout-terrain.fr 0.11.0
www.caleconpourhomme.fr 0.11.0

# --- Non sondables en CLI (basic auth) : valeurs de la sonde AA du 2026-08-18,
#     à reconfirmer au navigateur au prochain déploiement ---
preprod-iselection.vertuelle.com 0.7.0
technologia-arcadia.leparking.com 0.7.0
