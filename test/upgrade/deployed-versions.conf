# Ce fichier est lu par build.sh (gate #15) : le build teste l'upgrade vers le
# zip candidat depuis N-1 ET depuis la PLUS VIEILLE version listée ici. Le zip
# de cette version doit exister dans dist/ — sinon le build échoue.
