<!-- wp:acf/text {"name":"acf/text","data":{"text":"Investir en Monument Historique permet de \u003cstrong\u003econjuguer immobilier de caractère, préservation du patrimoine et optimisation fiscale.\u003c/strong\u003e Ce dispositif s’adresse principalement aux contribuables fortement imposés, qui peuvent, sous conditions, déduire une partie importante des travaux et charges liés au bien.\r\nEn contrepartie, l’investissement répond à des règles précises en matière de travaux, de conservation et de détention. Avant de se lancer, il est donc essentiel d’en comprendre le fonctionnement, les avantages fiscaux et les contraintes.","_text":"field_68920e552288a","block-id":"","_block-id":"field_699875bf628a1","apply_background_image":"","_apply_background_image":"field_68bfbce849e3e"},"mode":"preview"} /-->

<!-- wp:acf/title {"name":"acf/title","data":{"title":"Le dispositif Monument Historique : \u003cstrong\u003eprincipe et fonctionnement\u003c/strong\u003e","_title":"field_689da06d0955f","block-id":"","_block-id":"field_699875bf628a1","apply_background_image":"","_apply_background_image":"field_68bfbce849e3e"},"mode":"preview"} /-->

<!-- wp:acf/text {"name":"acf/text","data":{"text":"\u003ch3\u003eQuels biens : \u003cstrong\u003eclassés ou inscrits à l'ISMH\u003c/strong\u003e\u003c/h3\u003e\r\nL'éligibilité repose sur le niveau de protection juridique du bien, qui détermine l'étendue des obligations applicables au propriétaire. Le dispositif Monument Historique distingue deux niveaux de protection :\r\n\u003cul\u003e\r\n \t\u003cli\u003e\u003cstrong\u003eImmeuble classé\u003c/strong\u003e : le bien présente un i\u003cstrong\u003entérêt patrimonial majeur\u003c/strong\u003e et relève d'un cadre de protection particulièrement strict.\u003c/li\u003e\r\n \t\u003cli\u003e\u003cstrong\u003eImmeuble inscrit\u003c/strong\u003e : le bien présente un \u003cstrong\u003eintérêt historique ou architectural\u003c/strong\u003e suffisant pour justifier sa préservation, dans un cadre administratif adapté à ce niveau de protection.\u003c/li\u003e\r\n\u003c/ul\u003e\r\nElle concerne les immeubles classés ou inscrits au titre des Monuments Historiques, parfois désignés par l'acronyme \u003cstrong\u003e\u003ca href=\u0022https://www.essonne.gouv.fr/Services-de-l-Etat/Agriculture-environnement-amenagement-et-logement/UT-DRAC/Les-monuments-historiques/Edifices-inscrits-a-l-Inventaire-Supplementaire-des-Monuments-Historiques-ISMH\u0022\u003eISMH\u003c/a\u003e\u003c/strong\u003e (Immeuble Soumis au Statut des Monuments Historiques). Le classement ou l'inscription doit porter sur le bien lui-même : sa seule présence dans un secteur protégé ne suffit pas.\r\n\u003cul\u003e\r\n \t\u003cli\u003e\u003cstrong\u003eLe statut doit être vérifié avant l'acquisition\u003c/strong\u003e.\u003c/li\u003e\r\n \t\u003cli\u003eLa protection peut porter sur l'ensemble de l'immeuble ou sur certaines parties seulement, comme une façade, une toiture, un escalier ou des décors intérieurs. Ce périmètre conditionne le périmètre des travaux éligibles : seules les dépenses portant sur les parties protégées, ou indissociables de leur conservation, ouvrent droit au régime.\u003c/li\u003e\r\n\u003c/ul\u003e\r\nAvant toute réservation, nous conseillons de demander l'arrêté de classement ou d'inscription, le descriptif exact des parties protégées ainsi que les autorisations relatives aux travaux. Ces pièces confirment l'éligibilité juridique du bien et la cohérence du projet de restauration avant tout engagement. Les modalités d'obtention de ces autorisations de travaux auprès de la Direction régionale des affaires culturelles (DRAC) et de l'architecte des bâtiments de France (ABF) sont détaillées dans la section consacrée à l'encadrement des travaux.\r\n\r\nL'éligibilité du bien n'est toutefois que le premier volet du dispositif : sa protection impose aussi au propriétaire \u003cstrong\u003edes engagements précis\u003c/strong\u003e en matière de conservation, de travaux et de détention.","_text":"field_68920e552288a","block-id":"","_block-id":"field_699875bf628a1","apply_background_image":"","_apply_background_image":"field_68bfbce849e3e"},"mode":"preview"} /-->

<!-- wp:acf/alert {"name":"acf/alert","data":{"icon":20345,"_icon":"field_689c213cf48bd","text":"Un immeuble situé dans un site patrimonial remarquable ou couvert par une aire de mise en valeur de l'architecture et du patrimoine (AVAP) ne relève pas pour autant du régime. Seule une \u003ca href=\u0022https://www.culture.gouv.fr/aides-demarches/protections-labels-et-appellations/protection-au-titre-des-monuments-historiques\u0022 target=\u0022_blank\u0022 rel=\u0022noopener\u0022\u003e\u003cstrong\u003eprotection au titre des Monuments Historiques\u003c/strong\u003e\u003c/a\u003e ouvre droit au dispositif.","_text":"field_689c216ff48bf","color":"orange","_color":"field_689c217bf48c0","title":"\u003cstrong\u003ePoint de vigilance :\u003c/strong\u003e","_title":"field_689c2156f48be","block-id":"","_block-id":"field_699875bf628a1","apply_background_image":"","_apply_background_image":"field_68bfbce849e3e"},"mode":"preview"} /-->

<!-- wp:acf/text {"name":"acf/text","data":{"text":"\u003ch3\u003e\u003cstrong\u003eLe mécanisme \u003c/strong\u003ed'un investissement en Monument Historique\u003c/h3\u003e\r\n\u003ch4\u003eLe principe : \u003cstrong\u003eune déduction sur le revenu global\u003c/strong\u003e\u003c/h4\u003e\r\nLa fiscalité des Monuments Historiques repose sur une \u003cstrong\u003edéduction du revenu imposable\u003c/strong\u003e, et non sur une réduction d'impôt calculée à un taux fixe : les dépenses de restauration diminuent la base sur laquelle s'applique le barème progressif.\r\n\r\n\u003cstrong\u003eCe qui est déductible\u003c/strong\u003e\r\n\u003cul\u003e\r\n \t\u003cli\u003eles \u003cstrong\u003etravaux de restauration\u003c/strong\u003e éligibles portant sur les parties protégées ;\u003c/li\u003e\r\n \t\u003cli\u003ele \u003cstrong\u003edéficit foncier\u003c/strong\u003e créé, \u003cstrong\u003eimputable sur le revenu global sans limitation de montant\u003c/strong\u003e (selon l'usage du bien — voir la section dédiée dans « Un avantage fiscal puissant ») ;\u003c/li\u003e\r\n \t\u003cli\u003eles \u003cstrong\u003eintérêts d'emprunt\u003c/strong\u003e et les charges de conservation, selon l'affectation du bien et l'existence de recettes.\u003c/li\u003e\r\n\u003c/ul\u003e\r\n\u003ch4\u003e\u003cstrong\u003eLe cadre\u003c/strong\u003e\u003c/h4\u003e\r\n\u003cul\u003e\r\n \t\u003cli\u003eavantage \u003cstrong\u003ehors plafonnement des niches fiscales\u003c/strong\u003e de 10 000 €/an ;\u003c/li\u003e\r\n \t\u003cli\u003eni remboursement, ni crédit d'impôt : \u003cstrong\u003el'économie dépend directement de la tranche marginale d'imposition\u003c/strong\u003e (TMI) : plus elle est élevée, plus la déduction réduit l'impôt.\u003c/li\u003e\r\n\u003c/ul\u003e\r\nLes intérêts de l'emprunt contracté pour l'acquisition ainsi que certaines charges liées à la conservation du bien peuvent également être déductibles. Leur traitement dépend notamment de l'affectation du monument et de l'existence de recettes locatives.\r\n\r\n\u003cstrong\u003eBon à savoir :\u003c/strong\u003e contrairement aux dispositifs soumis au plafonnement global des niches fiscales de 10 000 € par an, le régime des Monuments Historiques autorise des dépenses supérieures à ce seuil sans perte de déductibilité — un atout en cas d'imposition élevée ou de perception ponctuelle de revenus exceptionnels.\r\n\r\n\u003cstrong\u003ePoint de vigilance :\u003c/strong\u003e toutes les dépenses ne deviennent pas automatiquement déductibles. Leur nature, leur date de paiement, le statut du bien et son mode d'exploitation doivent être vérifiés avant d'établir la déclaration.","_text":"field_68920e552288a","block-id":"","_block-id":"field_699875bf628a1","apply_background_image":"","_apply_background_image":"field_68bfbce849e3e"},"mode":"preview"} /-->

<!-- wp:acf/text {"name":"acf/text","data":{"text":"\u003ch3\u003eExemple chiffré complet : TMI 41 %, travaux étalés sur 3 ans\u003c/h3\u003e\n\u003cp\u003eLa simulation suivante illustre comment l'échelonnement des travaux permet de lisser l'économie d'impôt sur plusieurs années.\u003c/p\u003e\n\u003cp\u003ePrenons un foyer fiscal de trois parts, percevant 240 029 € de revenus et relevant d'une tranche marginale d'imposition de 41 %. Avant l'opération, son impôt annuel s'élève à 63 474 €.\u003c/p\u003e\n\u003cp\u003eLe projet est financé par un emprunt sur 20 ans au taux de 3,50 %. Le logement est loué nu pour 520 € par mois, soit 6 240 € de loyers annuels hors éventuelles périodes de vacance ou charges non récupérables.\u003c/p\u003e\n\u003cp\u003eLes travaux de restauration atteignent 192 100 € et sont répartis sur trois ans :\u003c/p\u003e","_text":"field_68920e552288a"},"mode":"preview"} /-->

<!-- wp:acf/text {"name":"acf/text","data":{"text":"\u003cp\u003eChaque année, la déduction des travaux fait chuter le revenu imposable et donc l'impôt :\u003c/p\u003e\n\u003cul\u003e\u003cli\u003e\u003cstrong\u003eAnnée 1\u003c/strong\u003e : revenu imposable ramené à 71 974 € — économie fiscale et sociale de \u003cstrong\u003e32 629 €\u003c/strong\u003e\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eAnnée 2\u003c/strong\u003e : revenu imposable de 89 348 € — économie de \u003cstrong\u003e26 097 €\u003c/strong\u003e\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eAnnée 3\u003c/strong\u003e : revenu imposable de 87 070 € — économie de \u003cstrong\u003e27 031 €\u003c/strong\u003e\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eAu total, l'opération génère \u003cstrong\u003e85 757 € d'économie fiscale et sociale sur trois ans\u003c/strong\u003e (à distinguer du montant des travaux de 192 100 €). L'impôt annuel du foyer passe ainsi de 63 474 € avant l'opération à 27 031 € en année 3.\u003c/p\u003e\n\u003cblockquote\u003e\u003cp\u003e\u003cstrong\u003ePoint de vigilance :\u003c/strong\u003e cette simulation repose sur des hypothèses précises de revenus, de financement, de loyers et de calendrier des travaux. Le résultat réel dépend notamment du montant effectivement appelé chaque année et de l'évolution de la situation du foyer. Une projection personnalisée reste nécessaire avant toute acquisition.\u003c/p\u003e\u003c/blockquote\u003e\n\u003cp\u003eUne telle opération ne convient donc pas à tous les profils : elle suppose une fiscalité suffisamment élevée, une capacité financière solide et un horizon d'investissement de long terme. Reste à déterminer quels investisseurs réunissent réellement ces conditions.\u003c/p\u003e","_text":"field_68920e552288a"},"mode":"preview"} /-->

<!-- wp:acf/text {"name":"acf/text","data":{"text":"\u003ch3\u003eQuel régime fiscal selon l'usage du bien ?\u003c/h3\u003e\n\u003cp\u003eSelon l'usage du bien, les recettes ne relèvent pas toutes de la même catégorie d'imposition : les loyers de la location nue sont imposés en revenus fonciers, les recettes d'exploitation touristique en bénéfices industriels et commerciaux (BIC), et certaines situations combinent plusieurs de ces régimes.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eBien loué nu et non occupé par le propriétaire\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eLes loyers relèvent des revenus fonciers. Les travaux de restauration éligibles, les intérêts d'emprunt et les autres charges déductibles sont d'abord imputés sur ces revenus. Le déficit foncier éventuel est ensuite imputé sur le revenu global dans les conditions décrites précédemment.\u003c/p\u003e\n\u003cp\u003eDans l'opération d'investissement présentée ici, le logement doit être loué nu pendant au moins trois ans. Le propriétaire ne doit pas l'occuper et doit conserver le bien pendant quinze ans.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eBien occupé par son propriétaire\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eL'occupation personnelle ne supprime pas nécessairement tout avantage fiscal. Toutefois, les règles de déduction diffèrent selon la nature des dépenses et l'éventuelle ouverture du monument au public. Ce cas ne correspond pas au schéma locatif étudié dans cet article et nécessite une analyse individualisée.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eBien procurant des recettes de visite\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eLes droits d'entrée et autres recettes liées à l'ouverture au public relèvent des bénéfices industriels et commerciaux, et non des revenus fonciers. Lorsque le propriétaire occupe également une partie du monument, les charges doivent être réparties entre l'usage personnel et l'activité générant des recettes.\u003c/p\u003e","_text":"field_68920e552288a"},"mode":"preview"} /-->

<!-- wp:acf/text {"name":"acf/text","data":{"text":"\u003cp\u003eLa déduction commence au titre de l'année du premier appel de fonds consacré aux travaux, pour les sommes effectivement payées durant cette année. Si la restauration s'étend sur plusieurs exercices, les dépenses sont déclarées au rythme des paiements.\u003c/p\u003e\n\u003cp\u003eEn pratique, les revenus, charges et travaux sont reportés dans la \u003ca href=\u0022https://www.impots.gouv.fr/formulaire/2044-speciale/declaration-speciale-des-revenus-fonciers\u0022 target=\u0022_blank\u0022 rel=\u0022noopener noreferrer\u0022\u003edéclaration spéciale des revenus fonciers n° 2044-SPE\u003c/a\u003e, puis intégrés à la déclaration annuelle de revenus. Les factures, appels de fonds et justificatifs de paiement doivent être conservés afin de répondre à une éventuelle demande de l'administration fiscale.\u003c/p\u003e","_text":"field_68920e552288a"},"mode":"preview"} /-->

<!-- wp:acf/text {"name":"acf/text","data":{"text":"\u003ch3\u003eLe cœur de cible : TMI 41 % et 45 %\u003c/h3\u003e\n\u003cp\u003e\u003ca href=\u0022https://www.iselection.com/b2c/investir/dispositif-fiscal-monuments-historiques/\u0022\u003einvestir en loi Monuments Historiques\u003c/a\u003e s'adresse principalement aux contribuables fortement imposés :\u003c/p\u003e\n\u003cul\u003e\u003cli\u003eceux dont la \u003cstrong\u003etranche marginale d'imposition (TMI) atteint 41 % ou 45 %\u003c/strong\u003e ;\u003c/li\u003e\u003cli\u003eles investisseurs percevant un \u003cstrong\u003erevenu exceptionnel\u003c/strong\u003e à neutraliser (plus-value de cession, héritage,Prime…) ;\u003c/li\u003e\u003cli\u003eles foyers payant un \u003cstrong\u003eimpôt annuel élevé\u003c/strong\u003e — plusieurs dizaines de milliers d'euros — sur toute la durée des travaux.\u003c/li\u003e\u003c/ul\u003e\n\u003cblockquote\u003e\u003cp\u003e\u003cstrong\u003eTMI 41 % et 45 % — le cœur de cible.\u003c/strong\u003e Dans l'exemple chiffré : 192 100 € de travaux sur 3 ans → 85 757 € d'économies fiscales et sociales pour un foyer à 41 % (impôt ramené de 63 474 € à ~27 000 €).\u003c/p\u003e\u003c/blockquote\u003e\n\u003cblockquote\u003e\u003cp\u003e\u003cstrong\u003eRevenus fonciers — location nue 3 ans minimum.\u003c/strong\u003e Dans l'exemple : 6 240 € de loyers annuels ; le déficit foncier créé est imputable sur le revenu global sans limitation de montant.\u003c/p\u003e\u003c/blockquote\u003e\n\u003cblockquote\u003e\u003cp\u003e\u003cstrong\u003eImpôt annuel — plusieurs dizaines de milliers d'euros.\u003c/strong\u003e Dans l'exemple : 63 474 € avant l'opération, ramené à 71 974 € de revenu imposable en année 1 (32 629 € d'économie). En deçà (TMI 0 % / 11 %), l'effet de la déduction reste limité.\u003c/p\u003e\u003c/blockquote\u003e\n\u003cp\u003eCe dispositif concerne également les investisseurs pour qui la dimension patrimoniale prime : l'acquisition d'un bien rare, la contribution à sa conservation et la préparation de sa transmission constituent des motivations qui complètent l'avantage fiscal.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003ePoint de vigilance :\u003c/strong\u003e ce choix est généralement moins adapté aux contribuables relevant des TMI de 0 % ou 11 %, pour lesquels l'effet de la déduction reste limité. Selon leurs objectifs, le \u003ca href=\u0022https://www.iselection.com/b2c/investir/dispositif-fiscal-lmnp/\u0022\u003edispositif LMNP pour investir en meublé\u003c/a\u003e, la nue-propriété ou un investissement locatif défiscalisant peuvent constituer des solutions plus cohérentes.\u003c/p\u003e","_text":"field_68920e552288a"},"mode":"preview"} /-->

<!-- wp:acf/text {"name":"acf/text","data":{"text":"\u003ch3\u003eTransmission et succession : quels avantages du Monument Historique ?\u003c/h3\u003e\n\u003cp\u003eUn Monument Historique peut, sous conditions, être transmis par donation ou succession sans droits de mutation à titre gratuit. Cette exonération, prévue par l'\u003ca href=\u0022https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000006305640\u0022 target=\u0022_blank\u0022 rel=\u0022noopener noreferrer\u0022\u003earticle 795 A du Code général des impôts\u003c/a\u003e, peut concerner l'immeuble protégé et les meubles constituant son complément historique ou artistique.\u003c/p\u003e\n\u003cp\u003eElle n'est toutefois pas automatique. Les héritiers, donataires ou légataires doivent conclure avec l'État une convention à durée indéterminée, après l'accord de l'administration compétente. Cette convention précise notamment les obligations d'entretien, de conservation et d'accès du public.\u003c/p\u003e\n\u003cblockquote\u003e\u003cp\u003e\u003cstrong\u003ePoint de vigilance\u003c/strong\u003e\u003c/p\u003e\u003c/blockquote\u003e\n\u003cblockquote\u003e\u003cp\u003eL'ouverture au public constitue une contrepartie essentielle. Sa durée et ses modalités sont fixées par la convention. Leur non-respect peut entraîner la remise en cause de l'exonération et l'exigibilité des droits dont le bénéficiaire avait été dispensé.\u003c/p\u003e\u003c/blockquote\u003e\n\u003cp\u003eLa transmission doit donc être préparée en amont avec un notaire et un conseil fiscal. Ils vérifieront le périmètre de la protection, les biens concernés, le mode de détention et les engagements que les bénéficiaires devront respecter durablement.\u003c/p\u003e\n\u003cp\u003eL'exonération peut s'étendre, dans certaines situations, aux parts d'une société civile immobilière détenant le monument. Une telle détention requiert une analyse spécifique, notamment concernant le régime fiscal de la société et les obligations imposées à ses associés.\u003c/p\u003e\n\u003cblockquote\u003e\u003cp\u003e\u003cstrong\u003eBon à savoir\u003c/strong\u003e\u003c/p\u003e\u003c/blockquote\u003e\n\u003cblockquote\u003e\u003cp\u003eCet avantage successoral est distinct de la déduction fiscale liée aux travaux. La qualité de Monument Historique ne suffit donc pas, à elle seule, à exonérer une donation ou une succession.\u003c/p\u003e\u003c/blockquote\u003e","_text":"field_68920e552288a"},"mode":"preview"} /-->

<!-- wp:acf/title {"name":"acf/title","data":{"title":"\u003cp\u003eConditions et points de vigilance\u003c/p\u003e","_title":"field_689da06d0955f"},"mode":"preview"} /-->

<!-- wp:acf/text {"name":"acf/text","data":{"text":"\u003cp\u003eLe propriétaire doit respecter plusieurs engagements pendant toute la durée de l'opération afin de conserver le bénéfice du régime fiscal des Monuments Historiques.\u003c/p\u003e\n\u003ch3\u003eLocation nue 3 ans et conservation du bien 15 ans\u003c/h3\u003e\n\u003cp\u003eL'opération repose sur deux durées d'engagement : conserver l'immeuble pendant au moins quinze ans à compter de son acquisition et, en cas d'imputation d'un déficit foncier sur le revenu global, proposer le logement en location nue pendant au moins trois ans.\u003c/p\u003e\n\u003cp\u003eUne revente anticipée permet à l'administration fiscale de remettre en cause les déductions pratiquées : les charges déduites sont alors réintégrées dans le revenu imposable des années concernées, ce qui entraîne un rappel d'impôt assorti des intérêts de retard. Le coût de la rupture peut donc dépasser la simple perte de l'avantage fiscal et doit être intégré dans la stratégie de détention dès l'acquisition.\u003c/p\u003e\n\u003cp\u003eLes travaux ne peuvent pas être engagés librement. Ils sont initiés par le propriétaire, puis soumis aux autorisations et au suivi des autorités compétentes en matière patrimoniale, dont le rôle est détaillé ci-dessous. Le programme doit respecter les prescriptions attachées au classement ou à l'inscription du monument.\u003c/p\u003e\n\u003cp\u003eLes délais administratifs et techniques peuvent s'étendre sur une période comprise entre un et trois ans. Avant l'acquisition, il convient donc d'examiner le calendrier prévisionnel, les autorisations obtenues, les appels de fonds et les modalités de suivi du chantier.\u003c/p\u003e\n\u003cblockquote\u003e\u003cp\u003e\u003cstrong\u003ePoint de vigilance\u003c/strong\u003e\u003c/p\u003e\u003c/blockquote\u003e\n\u003cblockquote\u003e\u003c/blockquote\u003e\n\u003cblockquote\u003e\u003cp\u003eLe non-respect de la durée de conservation, de l'engagement locatif ou des prescriptions relatives aux travaux peut remettre en cause tout ou partie de l'avantage fiscal. Le détail des justificatifs à conserver figure dans la section consacrée à la déclaration n° 2044-SPE.\u003c/p\u003e\u003c/blockquote\u003e\n\u003cp\u003eL'investissement comporte aussi les risques habituels d'un bien locatif, notamment la vacance, les impayés, les charges imprévues et un loyer inférieur aux prévisions. La capacité à financer le bien et les travaux doit donc rester compatible avec ces aléas.\u003c/p\u003e\n\u003cblockquote\u003e\u003cp\u003e\u003cstrong\u003eNotre conseil :\u003c/strong\u003e l'avantage fiscal ne doit pas constituer l'unique motivation de l'acquisition. La qualité de l'emplacement, la demande locative, le budget global, la durée de détention et le potentiel de valorisation patrimoniale doivent être étudiés conjointement.\u003c/p\u003e\u003c/blockquote\u003e\n\u003cp\u003eCes contraintes prennent tout leur sens lorsqu'elles sont traduites en chiffres. Un exemple concret permet de mesurer l'effort financier, l'économie d'impôt et la rentabilité potentielle d'un investissement en Monument Historique.\u003c/p\u003e","_text":"field_68920e552288a"},"mode":"preview"} /-->

<!-- wp:acf/text {"name":"acf/text","data":{"text":"\u003ch3\u003eComment les travaux sont-ils encadrés par la DRAC et l'ABF ?\u003c/h3\u003e\n\u003cp\u003eLe programme de restauration doit respecter les prescriptions de la Direction régionale des affaires culturelles (DRAC) et de l'Architecte des Bâtiments de France (ABF).\u003c/p\u003e\n\u003cp\u003eCes services examinent le projet au regard de la protection du bâtiment. Leur intervention porte notamment sur la nature des travaux, les matériaux, les techniques employées et la préservation des éléments architecturaux. Les autorisations nécessaires doivent donc être obtenues avant l'ouverture du chantier : le dossier de travaux est instruit par la DRAC, sur avis de l'ABF. Toute évolution importante du programme initial doit également être validée par ces mêmes services.\u003c/p\u003e\n\u003cp\u003ePour l'investisseur, cet encadrement implique d'intégrer les échanges administratifs et les délais d'instruction dès l'étude du projet.\u003c/p\u003e","_text":"field_68920e552288a"},"mode":"preview"} /-->

<!-- wp:acf/title {"name":"acf/title","data":{"title":"\u003cp\u003eLoi Malraux ou Monument Historique : quelles différences ?\u003c/p\u003e","_title":"field_689da06d0955f"},"mode":"preview"} /-->

<!-- wp:acf/text {"name":"acf/text","data":{"text":"\u003ch3\u003eMalraux vs Monuments Historiques : le comparatif en 7 points\u003c/h3\u003e\n\u003cp\u003eLes deux dispositifs soutiennent la réhabilitation du patrimoine ancien, mais avec des logiques fiscales opposées. Le visuel comparatif ci-dessous résume les différences en 7 lignes — le détail suit.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e[VISUEL à insérer dans WordPress : MALRAUX-vs-MH.png — comparatif Malraux vs Monuments Historiques en 7 lignes (objectifs, biens éligibles, avantage fiscal, plafond, durée d'engagement, contraintes, succession). Fichier transmis avec ces retours.]\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eObjectifs et biens éligibles.\u003c/strong\u003e Des deux côtés, l'objectif est de se constituer un patrimoine exceptionnel à des conditions optimisées — le Monument Historique y ajoute la préparation de la retraite. Côté biens : la loi Malraux vise un \u003cstrong\u003elogement ancien situé dans un Site Patrimonial Remarquable approuvé\u003c/strong\u003e ; la loi Monuments Historiques vise des \u003cstrong\u003ebiens inscrits ou classés au registre des Monuments Historiques\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eAvantage fiscal et plafond des dépenses.\u003c/strong\u003e Malraux accorde une \u003cstrong\u003eréduction d'impôt de 22 % du montant des travaux\u003c/strong\u003e (jusqu'à 30 % en secteur sauvegardé), avec un \u003cstrong\u003eplafond de 400 000 € de dépenses sur 4 ans\u003c/strong\u003e. Le Monument Historique permet une \u003cstrong\u003edéductibilité des travaux à 100 % sur le revenu imposable\u003c/strong\u003e, \u003cstrong\u003esans aucune limite de dépenses\u003c/strong\u003e — avec un impact immédiat sur la TMI, particulièrement précieux en cas de revenu exceptionnel à neutraliser.\u003c/p\u003e\n\u003ch3\u003eDurée d'engagement, contraintes et succession\u003c/h3\u003e\n\u003cp\u003e\u003cstrong\u003eDurée d'engagement :\u003c/strong\u003e Malraux impose de \u003cstrong\u003elouer 9 ans minimum\u003c/strong\u003e ; le Monument Historique impose de \u003cstrong\u003econserver le bien 15 ans minimum\u003c/strong\u003e, sans engagement de location. \u003cstrong\u003eContraintes :\u003c/strong\u003e des travaux sous contrôle des deux côtés — \u003cstrong\u003earchitecte des Bâtiments de France et autorisation du ministère de la Culture\u003c/strong\u003e (Malraux), \u003cstrong\u003eréglementation stricte pour préserver l'âme et l'histoire du bâtiment\u003c/strong\u003e (MH). \u003cstrong\u003eSuccession :\u003c/strong\u003e \u003cstrong\u003epas d'exonération des droits de succession en Malraux\u003c/strong\u003e, contre une \u003cstrong\u003eexonération possible dans certains cas en Monument Historique\u003c/strong\u003e (convention à durée indéterminée avec l'État, ouverture au public — voir la section Transmission).\u003c/p\u003e\n\u003cp\u003eLe choix dépend ainsi de la situation fiscale, de la nature du bien et du projet patrimonial. Un contribuable fortement imposé tirera davantage parti de la déduction du revenu global propre au Monument Historique, alors que la \u003ca href=\u0022https://www.iselection.com/b2c/blog/fiscalites/loi-malraux-avantages-inconvenients/\u0022\u003eréduction d'impôt loi Malraux\u003c/a\u003e, fixée par un taux, reste identique quelle que soit la tranche. Pour cadrer le dispositif voisin, voir \u003ca href=\u0022https://www.iselection.com/b2c/investir/dispositif-fiscal-malraux/\u0022\u003ele dispositif fiscal Malraux : comprendre et investir\u003c/a\u003e. Les deux dispositifs peuvent être mobilisés au sein d'une même stratégie patrimoniale, sous réserve de respecter leurs conditions respectives — une même dépense ne peut toutefois pas ouvrir droit deux fois à un avantage fiscal. La réhabilitation peut aussi relever du \u003ca href=\u0022https://www.iselection.com/b2c/investir/dispositif-fiscal-deficit-foncier/\u0022\u003edéficit foncier : fonctionnement et investissement\u003c/a\u003e.\u003c/p\u003e","_text":"field_68920e552288a"},"mode":"preview"} /-->

<!-- wp:acf/text {"name":"acf/text","data":{"text":"\u003ch3\u003ePeut-on louer le bien à un membre de sa famille ?\u003c/h3\u003e\n\u003cp\u003eOui. La location à un ascendant ou à un descendant est possible, à condition que le locataire soit hors du foyer fiscal du propriétaire et que le logement soit loué nu pendant au moins trois ans pour permettre l'imputation du déficit foncier.\u003c/p\u003e\n\u003ch3\u003eLe bien est-il exonéré de droits de succession ?\u003c/h3\u003e\n\u003cp\u003eSous conditions : si le monument est ouvert au public et qu'une convention à durée indéterminée est conclue avec l'État (ministère de la Culture), la transmission par donation ou succession peut être exonérée de droits de mutation à titre gratuit, en application de l'article 795 A du CGI.\u003c/p\u003e\n\u003ch3\u003eMonument Historique ou Malraux : que choisir ?\u003c/h3\u003e\n\u003cp\u003eTout dépend de votre situation fiscale : la déduction du revenu global (MH) profite surtout aux TMI élevées (41 % et 45 %), tandis que la réduction d'impôt à taux fixe (Malraux) est identique quelle que soit la tranche. Les deux dispositifs peuvent être combinés au sein d'une même stratégie patrimoniale, sous réserve de respecter leurs conditions respectives — voir notre comparatif ci-dessus.\u003c/p\u003e\n\u003ch3\u003eQue se passe-t-il en cas de revente avant 15 ans ?\u003c/h3\u003e\n\u003cp\u003eLa revente anticipée permet à l'administration fiscale de remettre en cause les déductions pratiquées : les charges déduites sont réintégrées dans le revenu imposable, avec rappel d'impôt et intérêts de retard. De plus, toute modification, vente ou transformation du bien sans autorisation du ministère de la Culture est interdite.\u003c/p\u003e","_text":"field_68920e552288a"},"mode":"preview"} /-->

<!-- wp:acf/title {"name":"acf/title","data":{"title":"\u003cp\u003eEn conclusion : un dispositif puissant pour les contribuables fortement imposés\u003c/p\u003e","_title":"field_689da06d0955f"},"mode":"preview"} /-->

<!-- wp:acf/text {"name":"acf/text","data":{"text":"\u003cp\u003eLe dispositif Monument Historique offre l'une des défiscalisations les plus puissantes du marché : 100 % des travaux de restauration déduits du revenu global, sans plafonnement, avec un effet concentré sur 1 à 3 ans. En contrepartie, il exige un bien d'exception, des travaux encadrés par l'État et des engagements longs — location nue 3 ans, conservation 15 ans. Pour les TMI de 41 % et 45 %, ou en cas de revenu exceptionnel à neutraliser, c'est un levier à étudier sérieusement avec un conseiller spécialisé. Pour comparer avec le dispositif voisin, voir \u003ca href=\u0022https://www.iselection.com/b2c/investir/dispositif-fiscal-malraux/\u0022\u003ele dispositif fiscal Malraux\u003c/a\u003e et \u003ca href=\u0022https://www.iselection.com/b2c/investir/dispositif-fiscal-deficit-foncier/\u0022\u003ele déficit foncier\u003c/a\u003e.\u003c/p\u003e","_text":"field_68920e552288a"},"mode":"preview"} /-->
